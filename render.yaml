# CodHoot BEAM execution service (erlang + elixir) — Render blueprint.
#
# This repository IS the execution server for the BEAM languages: one service
# for the languages that share the Erlang virtual machine, because the toolchain
# is the toolchain. Erlang compiles with erlc to BEAM bytecode and Elixir with
# elixirc to the same bytecode; there is nothing a second service could add.
#
# Contract with codhoot-backend (internal/execution):
#   POST /compile   signed with HMAC(timestamp + path + sha256(body)) keyed by
#                   CODHOOT_INTERNAL_SECRET. Unsigned or tampered requests get
#                   401 — the service refuses every unauthenticated call.
#                   The request's "language" field selects the toolchain
#                   ("erlang" or "elixir").
#   GET /health     and /health/live stay open: Render health checks and the
#                   keepalive pinger must never need a signature.
#
# Point the backend at this service with ONE variable, which covers both
# languages:
#   COMPILER_IMAGE_BEAM_SERVICE_URL=https://<this service>.onrender.com
# The backend consults per-language URLs first, then the runtime-image URL, then
# the toolchain-family URL; this service is registered through the first two
# fallbacks so it needs no per-language entry.
#
# Free-tier notes: the instance sleeps after ~15 min of no traffic, so the
# first compile after idle pays a cold start (up to 30-60 s). The backend
# treats HTML and transient 5xx on /compile as "waking up" and retries.
services:
  - type: web
    name: codhoot-beam-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Render routes traffic to the port the service listens on; the image
      # defaults to 8081, so pin it here instead of relying on the image.
      - key: PORT
        value: "10000"
      # Two BEAM virtual machines at a time. A BEAM allocates its scheduler and
      # process heap eagerly, so the four the single-language services use would
      # push a 512MB free instance into swapping.
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      # Must be the SAME value as the backend's CODHOOT_INTERNAL_SECRET:
      # it is the HMAC key that makes signed requests verifiable.
      - key: CODHOOT_INTERNAL_SECRET
        sync: false